name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest -q
      - name: Build distribution
        run: |
          pip install --quiet build
          python -m build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check .

  docs:
    name: docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # CLI.md is generated from the parser. A stale one is a wrong claim about
      # the interface, so it fails here rather than misleading a reader.
      - run: python gen_cli_docs.py equiv-receipt --single equiv-receipt --check
      - run: pytest -q tests/test_docs.py
      # Badges carrying a number are generated by running the code. One saying
      # "26 passing" over a suite of 409 is a claim the code does not support,
      # and that is what shipped before this job existed.
      - run: python refresh_badges.py equiv-receipt --single equiv-receipt --check
